<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RealEstate India</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif !important;
            background-color: #0A192F !important;
            color: #FFFFFF !important;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Dark Header Navigation Bar */
        .navbar {
            background: #06101E !important;
            border-bottom: 1px solid #1E293B !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 1000 !important;
        }

        .nav-container {
            max-width: 1320px !important;
            margin: 0 auto !important;
            padding: 0.75rem 1.5rem !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
        }

        .nav-logo {
            display: flex !important;
            align-items: center !important;
            gap: 0.6rem !important;
            font-size: 1.25rem !important;
            font-weight: 800 !important;
            color: #FFFFFF !important;
            text-decoration: none !important;
            letter-spacing: -0.3px !important;
        }

        .nav-logo i {
            color: #2563EB !important;
            font-size: 1.35rem !important;
        }

        .nav-right-auth {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-nav-login {
            background: transparent !important;
            border: 1px solid rgba(59, 130, 246, 0.5) !important;
            color: #93C5FD !important;
            padding: 0.45rem 1.1rem !important;
            border-radius: 8px !important;
            font-size: 0.875rem !important;
            font-weight: 600 !important;
            text-decoration: none !important;
            transition: all 0.2s ease !important;
        }

        .btn-nav-login:hover {
            background: rgba(37, 99, 235, 0.2) !important;
            color: #FFFFFF !important;
        }

        .btn-nav-register {
            background: #2563EB !important;
            color: #FFFFFF !important;
            padding: 0.45rem 1.1rem !important;
            border-radius: 8px !important;
            font-size: 0.875rem !important;
            font-weight: 700 !important;
            text-decoration: none !important;
        }

        /* Dark Geometric Mesh SVG Background Canvas */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(13, 148, 136, 0.15) 0%, transparent 45%),
                linear-gradient(135deg, #040D1A 0%, #0A192F 50%, #061324 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg stroke='%2338bdf8' stroke-width='0.4' stroke-opacity='0.12'%3E%3Cpath d='M50 50L20 20M0 0l80 80M0 80L80 0M30 10l40 40M10 30l40 40'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            z-index: -1;
            pointer-events: none;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3.5rem 1.5rem;
        }

        .auth-card-clean {
            background: #FFFFFF !important;
            border-radius: 18px !important;
            padding: 2.75rem 2.25rem !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3) !important;
            width: 100%;
            max-width: 500px;
            color: #0F172A !important;
            transition: all 0.25s ease;
        }

        .auth-card-clean:hover {
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4) !important;
        }

        .auth-header-clean {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-icon-box {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: #DBEAFE;
            color: #1D4ED8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 1.25rem auto;
        }

        .auth-header-clean h1 {
            font-size: 1.65rem;
            font-weight: 800;
            color: #0F172A;
            margin: 0 0 0.35rem 0;
            letter-spacing: -0.4px;
        }

        .auth-header-clean p {
            color: #64748B;
            font-size: 0.925rem;
            font-weight: 600;
            margin: 0;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.15rem;
        }

        .form-group-custom {
            margin-bottom: 1.15rem;
        }

        .form-group-custom label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.4rem;
        }

        .form-group-custom label i {
            color: #2563EB;
            margin-right: 0.35rem;
        }

        .form-group-custom input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            color: #0F172A;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-group-custom input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.18);
        }

        .btn-auth-submit {
            width: 100%;
            padding: 0.85rem;
            background: #2563EB !important;
            color: #FFFFFF !important;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-auth-submit:hover {
            background: #1D4ED8 !important;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }

        .auth-footer-text {
            text-align: center;
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid #E2E8F0;
            font-size: 0.9rem;
            color: #64748B;
            font-weight: 600;
        }

        .auth-footer-text a {
            color: #2563EB;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .form-grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/templates/dashboard.html" class="nav-logo">
                <i class="fas fa-home"></i>
                <span>RealEstate India</span>
            </a>
            <div class="nav-right-auth">
                <a href="/templates/login.html" class="btn-nav-login">Login</a>
                <a href="/templates/register.html" class="btn-nav-register">Register</a>
            </div>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card-clean">
            <div class="auth-header-clean">
                <div class="auth-icon-box">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1>Create Account</h1>
                <p>Register for Premium Property Access</p>
            </div>

            <form id="registerForm">
                <div class="form-grid-2">
                    <div class="form-group-custom">
                        <label for="username"><i class="fas fa-user"></i> Username</label>
                        <input type="text" id="username" name="username" placeholder="Username" required>
                    </div>

                    <div class="form-group-custom">
                        <label for="email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" name="email" placeholder="email@example.com" required>
                    </div>

                    <div class="form-group-custom">
                        <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
                    </div>

                    <div class="form-group-custom">
                        <label for="full_name"><i class="fas fa-id-card"></i> Full Name</label>
                        <input type="text" id="full_name" name="full_name" placeholder="Full Name" required>
                    </div>

                    <div class="form-group-custom">
                        <label for="city"><i class="fas fa-city"></i> City</label>
                        <input type="text" id="city" name="city" placeholder="Mumbai" required>
                    </div>

                    <div class="form-group-custom">
                        <label for="password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </form>

            <div class="auth-footer-text">
                <p>Already have an account? 
                    <a href="/templates/login.html">Login here</a>
                </p>
            </div>

            <div id="message" class="message" style="display: none; margin-top: 1rem;"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-left">
                RealEstate India | &copy; 2026 | Jatni, Odisha
            </div>
            <div class="footer-right">
                <a href="/templates/dashboard.html">Home</a>
                <a href="/templates/properties.html">Links</a>
                <a href="/templates/analysis.html">Cambra</a>
                <a href="/templates/profile.html">Contact</a>
            </div>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                username: formData.get('username'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                full_name: formData.get('full_name'),
                city: formData.get('city'),
                password: formData.get('password')
            };

            const button = e.target.querySelector('button');
            const originalText = button.innerHTML;
            button.innerHTML = '<div class="loading"></div> Registering...';
            button.disabled = true;
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('message').className = 'message success';
                    document.getElementById('message').textContent = result.message;
                    document.getElementById('message').style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = '/templates/login.html';
                    }, 1500);
                } else {
                    document.getElementById('message').className = 'message error';
                    document.getElementById('message').textContent = result.message;
                    document.getElementById('message').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('message').className = 'message error';
                document.getElementById('message').textContent = 'Registration failed. Please try again.';
                document.getElementById('message').style.display = 'block';
            } finally {
                button.innerHTML = originalText;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
