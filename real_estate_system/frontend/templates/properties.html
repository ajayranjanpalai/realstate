<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties - RealEstate India</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-building"></i>
                <span>RealEstate India</span>
            </div>
            <div class="nav-menu">
                <a href="/templates/dashboard.html" class="nav-link">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="/templates/properties.html" class="nav-link active">
                    <i class="fas fa-search"></i> Properties
                </a>
                <a href="/templates/bookings.html" class="nav-link">
                    <i class="fas fa-calendar-check"></i> My Bookings
                </a>
                <a href="/templates/analysis.html" class="nav-link">
                    <i class="fas fa-chart-bar"></i> Analysis
                </a>
                <a href="/templates/profile.html" class="nav-link">
                    <i class="fas fa-user"></i> Profile
                </a>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div id="authCheck" style="display: none;">
            <div class="message error">
                <p>You are not logged in. Redirecting to login page...</p>
            </div>
        </div>

        <div id="mainContent" style="display: none;">
            <div class="dashboard-header">
                <h1>Browse Properties</h1>
                <p>Find your dream property from our extensive collection</p>
            </div>

            <div class="filter-form">
                <h3>Filter Properties</h3>
                <form id="filterForm" class="filter-grid">
                    <div class="form-group">
                        <label for="city">City</label>
                        <select id="city" name="city">
                            <option value="">All Cities</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="type">Property Type</label>
                        <select id="type" name="type">
                            <option value="">All Types</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="min_price">Min Price (Cr)</label>
                        <input type="number" id="min_price" name="min_price" step="0.1" min="0" placeholder="0.5">
                    </div>
                    <div class="form-group">
                        <label for="max_price">Max Price (Cr)</label>
                        <input type="number" id="max_price" name="max_price" step="0.1" min="0" placeholder="5.0">
                    </div>
                    <div class="form-group">
                        <label for="bhk">BHK</label>
                        <select id="bhk" name="bhk">
                            <option value="">Any</option>
                            <option value="1">1 BHK</option>
                            <option value="2">2 BHK</option>
                            <option value="3">3 BHK</option>
                            <option value="4">4 BHK</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-filter"></i> Apply Filters
                        </button>
                        <button type="button" class="btn-secondary" onclick="clearFilters()">
                            <i class="fas fa-times"></i> Clear
                        </button>
                    </div>
                </form>
            </div>

            <div id="message" class="message"></div>

            <div class="properties-section">
                <div class="properties-header">
                    <h2>Available Properties</h2>
                    <div class="properties-count">
                        <span id="propertiesCount">0</span> properties found
                    </div>
                </div>
                <div id="propertiesList" class="properties-grid">
                    <!-- Properties will be loaded here -->
                    <div class="loading-placeholder">
                        <div class="loading"></div>
                        <p>Loading properties...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let allProperties = [];
        let cities = [];
        let types = [];

        // Check authentication on page load
        async function checkAuth() {
            try {
                showMessage('Checking authentication...', 'info');
                const response = await fetch('/api/user');
                const data = await response.json();
                
                if (!data.success || !data.user) {
                    document.getElementById('authCheck').style.display = 'block';
                    document.getElementById('mainContent').style.display = 'none';
                    showMessage('Please login to view properties', 'error');
                    
                    setTimeout(() => {
                        window.location.href = '/templates/login.html';
                    }, 2000);
                    return false;
                }
                
                document.getElementById('authCheck').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                return true;
            } catch (error) {
                console.error('Auth check failed:', error);
                document.getElementById('authCheck').style.display = 'block';
                document.getElementById('mainContent').style.display = 'none';
                showMessage('Network error: Cannot verify login status', 'error');
                
                setTimeout(() => {
                    window.location.href = '/templates/login.html';
                }, 2000);
                return false;
            }
        }

        async function loadFilterOptions() {
            try {
                showMessage('Loading filter options...', 'info');
                
                // Load cities
                const citiesResponse = await fetch('/api/cities');
                const citiesData = await citiesResponse.json();
                
                if (citiesData.success) {
                    cities = citiesData.cities;
                    const citySelect = document.getElementById('city');
                    cities.forEach(city => {
                        const option = document.createElement('option');
                        option.value = city;
                        option.textContent = city;
                        citySelect.appendChild(option);
                    });
                    console.log(`✅ Loaded ${cities.length} cities`);
                } else {
                    throw new Error('Failed to load cities');
                }

                // Load types
                const typesResponse = await fetch('/api/types');
                const typesData = await typesResponse.json();
                
                if (typesData.success) {
                    types = typesData.types;
                    const typeSelect = document.getElementById('type');
                    types.forEach(type => {
                        const option = document.createElement('option');
                        option.value = type;
                        option.textContent = type;
                        typeSelect.appendChild(option);
                    });
                    console.log(`✅ Loaded ${types.length} property types`);
                } else {
                    throw new Error('Failed to load property types');
                }
                
                showMessage('Filter options loaded successfully', 'success', 3000);
            } catch (error) {
                console.error('Failed to load filter options:', error);
                showMessage(`Error loading filter options: ${error.message}`, 'error');
            }
        }

        async function loadProperties(filters = {}) {
            try {
                showMessage('Loading properties...', 'info');
                
                // Build query string from filters
                const params = new URLSearchParams();
                Object.keys(filters).forEach(key => {
                    if (filters[key]) {
                        params.append(key, filters[key]);
                    }
                });

                const url = `/api/properties?${params}`;
                console.log(`🔍 Fetching properties from: ${url}`);
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log(`✅ Properties response:`, data);
                
                if (data.success) {
                    allProperties = data.properties;
                    displayProperties(allProperties);
                    updatePropertiesCount(allProperties.length);
                    showMessage(`Found ${data.count || data.properties.length} properties`, 'success', 3000);
                } else {
                    throw new Error(data.message || 'Failed to load properties');
                }
            } catch (error) {
                console.error('Failed to load properties:', error);
                showMessage(`Error: ${error.message}`, 'error');
                displayProperties([]);
                updatePropertiesCount(0);
            }
        }

        function displayProperties(properties) {
            const container = document.getElementById('propertiesList');
            if (!container) return;

            if (properties.length === 0) {
                container.innerHTML = `
                    <div class="text-center" style="grid-column: 1 / -1;">
                        <i class="fas fa-home fa-3x" style="color: #64748b; margin-bottom: 1rem;"></i>
                        <h3>No properties found</h3>
                        <p>Try adjusting your filters to see more properties.</p>
                        <button class="btn-primary" onclick="clearFilters()">
                            <i class="fas fa-times"></i> Clear Filters
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = properties.map(property => `
                <div class="property-card">
                    <div class="property-image" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <i class="fas fa-home"></i>
                        ${!property.Available ? '<div class="property-booked">Booked</div>' : ''}
                    </div>
                    <div class="property-content">
                        <h3 class="property-title">${property.Title || 'Property'}</h3>
                        <div class="property-location">
                            <i class="fas fa-map-marker-alt"></i>
                            ${property.Locality || 'Unknown'}, ${property.City || 'Unknown'}
                        </div>
                        <div class="property-details">
                            <div class="property-detail">
                                <i class="fas fa-expand-arrows-alt"></i>
                                ${property.Area_sqft ? property.Area_sqft.toLocaleString() + ' sqft' : 'N/A'}
                            </div>
                            <div class="property-detail">
                                <i class="fas fa-door-closed"></i>
                                ${property.BHK > 0 ? property.BHK + ' BHK' : 'Commercial'}
                            </div>
                            <div class="property-detail">
                                <i class="fas fa-building"></i>
                                ${property.Type || 'Unknown'}
                            </div>
                            <div class="property-detail">
                                <i class="fas fa-paint-brush"></i>
                                ${property.Furnishing || 'Unknown'}
                            </div>
                        </div>
                        <div class="property-price">
                            ₹${property.Price_Cr || 0} Crores
                        </div>
                        <div class="property-actions">
                            <button class="btn-primary" onclick="bookProperty('${property.PropertyID}')" ${!property.Available ? 'disabled' : ''}>
                                <i class="fas fa-calendar-check"></i> 
                                ${property.Available ? 'Book Now' : 'Booked'}
                            </button>
                            <button class="btn-secondary" onclick="viewPropertyDetails('${property.PropertyID}')">
                                <i class="fas fa-info-circle"></i> Details
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updatePropertiesCount(count) {
            const countElement = document.getElementById('propertiesCount');
            if (countElement) {
                countElement.textContent = count;
            }
        }

        async function bookProperty(propertyId) {
            if (!confirm('Are you sure you want to book this property?')) {
                return;
            }

            try {
                const userResponse = await fetch('/api/user');
                const userData = await userResponse.json();
                
                if (!userData.success) {
                    showMessage('Please login to book properties', 'error');
                    return;
                }

                const userPreferences = {
                    name: userData.user.full_name,
                    email: userData.user.email,
                    phone: userData.user.phone
                };

                showMessage('Processing booking...', 'info');

                const response = await fetch('/api/book', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        property_id: propertyId,
                        user_preferences: userPreferences
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    // Reload properties to update availability
                    loadProperties(getCurrentFilters());
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                console.error('Booking failed:', error);
                showMessage('Booking failed. Please try again.', 'error');
            }
        }

        function viewPropertyDetails(propertyId) {
            const property = allProperties.find(p => p.PropertyID === propertyId);
            if (property) {
                const details = `
Property Details:
----------------
Title: ${property.Title || 'N/A'}
Location: ${property.Locality || 'N/A'}, ${property.City || 'N/A'}
Type: ${property.Type || 'N/A'}
BHK: ${property.BHK > 0 ? property.BHK + ' BHK' : 'Commercial'}
Area: ${property.Area_sqft ? property.Area_sqft.toLocaleString() + ' sqft' : 'N/A'}
Price: ₹${property.Price_Cr || 0} Crores
Price per sqft: ₹${property.Price_per_sqft || 0}
Furnishing: ${property.Furnishing || 'N/A'}
Transaction: ${property.TransactionType || 'N/A'}
Status: ${property.Available ? 'Available' : 'Booked'}
Listed Date: ${property.ListedDate || 'N/A'}
                `;
                alert(details);
            }
        }

        function getCurrentFilters() {
            const formData = new FormData(document.getElementById('filterForm'));
            return {
                city: formData.get('city'),
                type: formData.get('type'),
                min_price: formData.get('min_price'),
                max_price: formData.get('max_price'),
                bhk: formData.get('bhk')
            };
        }

        function clearFilters() {
            document.getElementById('filterForm').reset();
            loadProperties();
        }

        function showMessage(message, type, autoHide = 5000) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = `
                <div class="message-content">
                    <i class="fas fa-${getMessageIcon(type)}"></i>
                    <span>${message}</span>
                </div>
            `;
            messageDiv.style.display = 'block';

            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, autoHide);
            }
        }

        function getMessageIcon(type) {
            const icons = {
                'success': 'check-circle',
                'error': 'exclamation-circle',
                'info': 'info-circle',
                'warning': 'exclamation-triangle'
            };
            return icons[type] || 'info-circle';
        }

        async function logout() {
            try {
                showMessage('Logging out...', 'info');
                await fetch('/api/logout', {
                    method: 'POST'
                });
                window.location.href = '/templates/login.html';
            } catch (error) {
                console.error('Logout failed:', error);
                window.location.href = '/templates/login.html';
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuth();
            if (isAuthenticated) {
                await loadFilterOptions();
                await loadProperties();

                document.getElementById('filterForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    loadProperties(getCurrentFilters());
                });
            }
        });
    </script>

    <style>
        .properties-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .properties-count {
            background: var(--primary-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-weight: 600;
        }

        .filter-form {
            background: var(--surface-color);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .filter-form h3 {
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: end;
        }

        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .property-card {
            background: var(--surface-color);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .property-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .property-image {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            position: relative;
        }

        .property-booked {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #ef4444;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .property-content {
            padding: 1.5rem;
        }

        .property-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .property-location {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .property-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .property-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .property-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1rem;
            text-align: center;
        }

        .property-actions {
            display: flex;
            gap: 0.75rem;
        }

        .property-actions button {
            flex: 1;
        }

        .loading-placeholder {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .loading-placeholder .loading {
            margin: 0 auto 1rem;
        }

        .text-center {
            text-align: center;
            padding: 3rem;
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .properties-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .properties-grid {
                grid-template-columns: 1fr;
            }

            .property-actions {
                flex-direction: column;
            }
        }
    </style>
</body>
</html>
