<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealEstate India - Professional Property Management</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/templates/dashboard.html" class="nav-logo">
                <i class="fas fa-home"></i>
                <span>RealEstate India</span>
            </a>
            <div class="nav-menu" id="navMenu">
                <a href="/templates/dashboard.html" class="nav-link" id="nav-dashboard">Home</a>
                <a href="/templates/properties.html" class="nav-link" id="nav-properties">Explore Properties</a>
                <a href="/templates/bookings.html" class="nav-link" id="nav-bookings">My Bookings</a>
                <a href="/templates/analysis.html" class="nav-link" id="nav-analytics">Analytics</a>
                <a href="/templates/profile.html" class="nav-link" id="nav-profile">Profile</a>
            </div>
            <div class="nav-right">
                <button class="btn-nav-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-left">
                RealEstate India | &copy; 2026 | Jatni, Odisha
            </div>
            <div class="footer-right">
                <a href="/templates/dashboard.html">Home</a>
                <a href="/templates/properties.html">Links</a>
                <a href="/templates/analysis.html">Cambra</a>
                <a href="/templates/profile.html">Contact</a>
            </div>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
    <script>
        // Highlight active nav tab based on URL path
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            if (path.includes('properties')) {
                document.getElementById('nav-properties')?.classList.add('active');
            } else if (path.includes('bookings')) {
                document.getElementById('nav-bookings')?.classList.add('active');
            } else if (path.includes('analysis')) {
                document.getElementById('nav-analytics')?.classList.add('active');
            } else if (path.includes('profile')) {
                document.getElementById('nav-profile')?.classList.add('active');
            } else {
                document.getElementById('nav-dashboard')?.classList.add('active');
            }

            // Load user name in navbar
            fetch('/api/user')
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.user) {
                        const nameEl = document.getElementById('navUserName');
                        if (nameEl) nameEl.textContent = data.user.full_name || data.user.username || 'Ajay K.';
                    }
                })
                .catch(() => {});
        });

        async function logout() {
            try {
                const response = await fetch('/api/logout', { method: 'POST' });
                const result = await response.json();
                window.location.href = '/templates/login.html';
            } catch (err) {
                window.location.href = '/templates/login.html';
            }
        }
    </script>
</body>
</html>
