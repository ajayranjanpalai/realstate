<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealEstate India - Professional Property Management</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-building"></i>
                <span>RealEstate India</span>
            </div>
            <div class="nav-menu" id="navMenu">
                <a href="/templates/dashboard.html" class="nav-link">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="/templates/properties.html" class="nav-link">
                    <i class="fas fa-search"></i> Properties
                </a>
                <a href="/templates/bookings.html" class="nav-link">
                    <i class="fas fa-calendar-check"></i> My Bookings
                </a>
                <a href="/templates/analysis.html" class="nav-link">
                    <i class="fas fa-chart-bar"></i> Analysis
                </a>
                <a href="/templates/profile.html" class="nav-link">
                    <i class="fas fa-user"></i> Profile
                </a>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
            <div class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 RealEstate India. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Contact Us</a>
            </div>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
</body>
</html>
