<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - RealEstate India</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-building"></i>
                <span>RealEstate India</span>
            </div>
            <div class="nav-menu">
                <a href="/templates/dashboard.html" class="nav-link">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="/templates/properties.html" class="nav-link">
                    <i class="fas fa-search"></i> Properties
                </a>
                <a href="/templates/bookings.html" class="nav-link active">
                    <i class="fas fa-calendar-check"></i> My Bookings
                </a>
                <a href="/templates/analysis.html" class="nav-link">
                    <i class="fas fa-chart-bar"></i> Analysis
                </a>
                <a href="/templates/profile.html" class="nav-link">
                    <i class="fas fa-user"></i> Profile
                </a>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div id="authCheck" style="display: none;">
            <div class="message error">
                <p>You are not logged in. Redirecting to login page...</p>
            </div>
        </div>

        <div id="mainContent" style="display: none;">
            <div class="dashboard-header">
                <h1>My Bookings</h1>
                <p>View your property booking history and details</p>
            </div>

            <div id="message" class="message"></div>

            <div class="bookings-section">
                <div id="bookingsList">
                    <!-- Bookings will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // Check authentication on page load
        async function checkAuth() {
            try {
                const response = await fetch('/api/user');
                const data = await response.json();
                
                if (!data.success || !data.user) {
                    // Not logged in, show error and redirect
                    document.getElementById('authCheck').style.display = 'block';
                    document.getElementById('mainContent').style.display = 'none';
                    
                    setTimeout(() => {
                        window.location.href = '/templates/login.html';
                    }, 2000);
                    return false;
                }
                
                // User is logged in, show main content
                document.getElementById('authCheck').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                return true;
            } catch (error) {
                console.error('Auth check failed:', error);
                document.getElementById('authCheck').style.display = 'block';
                document.getElementById('mainContent').style.display = 'none';
                
                setTimeout(() => {
                    window.location.href = '/templates/login.html';
                }, 2000);
                return false;
            }
        }

        async function loadBookings() {
            try {
                const response = await fetch('/api/bookings');
                const data = await response.json();
                
                if (data.success) {
                    displayBookings(data.bookings);
                } else {
                    showMessage('Failed to load bookings', 'error');
                }
            } catch (error) {
                console.error('Failed to load bookings:', error);
                showMessage('Failed to load bookings', 'error');
            }
        }

        function displayBookings(bookings) {
            const container = document.getElementById('bookingsList');
            if (!container) return;

            if (bookings.length === 0) {
                container.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-calendar-times fa-3x" style="color: #64748b; margin-bottom: 1rem;"></i>
                        <h3>No bookings found</h3>
                        <p>You haven't made any bookings yet.</p>
                        <a href="/templates/properties.html" class="btn-primary">
                            <i class="fas fa-search"></i> Browse Properties
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = bookings.map(booking => `
                <div class="booking-card">
                    <div class="booking-header">
                        <div>
                            <h3 class="booking-title">${booking.property_title}</h3>
                            <div class="property-location">
                                <i class="fas fa-map-marker-alt"></i>
                                ${booking.property_locality}, ${booking.property_city}
                            </div>
                        </div>
                        <span class="booking-status confirmed">${booking.status}</span>
                    </div>
                    
                    <div class="booking-details">
                        <div class="booking-detail">
                            <i class="fas fa-building"></i>
                            ${booking.property_type}
                        </div>
                        <div class="booking-detail">
                            <i class="fas fa-door-closed"></i>
                            ${booking.property_bhk > 0 ? booking.property_bhk + ' BHK' : 'Commercial'}
                        </div>
                        <div class="booking-detail">
                            <i class="fas fa-expand-arrows-alt"></i>
                            ${booking.property_area.toLocaleString()} sqft
                        </div>
                        <div class="booking-detail">
                            <i class="fas fa-calendar"></i>
                            ${new Date(booking.booking_date).toLocaleDateString()}
                        </div>
                    </div>

                    <div class="booking-pricing">
                        <div class="price-item">
                            <span>Total Price:</span>
                            <strong class="booking-price">₹${booking.total_amount} Crores</strong>
                        </div>
                        <div class="price-item">
                            <span>Advance Paid:</span>
                            <strong>₹${booking.amount_advance} Crores</strong>
                        </div>
                        <div class="price-item">
                            <span>Balance:</span>
                            <strong>₹${(booking.total_amount - booking.amount_advance).toFixed(2)} Crores</strong>
                        </div>
                    </div>

                    <div class="booking-footer">
                        <div class="booking-id">
                            <strong>Booking ID:</strong> ${booking.booking_id}
                        </div>
                        <div class="booking-id">
                            <strong>Property ID:</strong> ${booking.property_id}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';
        }

        async function logout() {
            try {
                await fetch('/api/logout', {
                    method: 'POST'
                });
                window.location.href = '/templates/login.html';
            } catch (error) {
                window.location.href = '/templates/login.html';
            }
        }

        // Load bookings when page loads
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuth();
            if (isAuthenticated) {
                loadBookings();
            }
        });
    </script>

    <style>
        .bookings-section {
            margin-top: 2rem;
        }

        .booking-card {
            background: var(--surface-color);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--primary-color);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .booking-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .booking-status {
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .booking-status.confirmed {
            background: #d1fae5;
            color: #065f46;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--background-color);
            border-radius: 0.5rem;
        }

        .booking-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .booking-pricing {
            background: #f0f9ff;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .booking-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .booking-footer {
            display: flex;
            gap: 2rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .text-center {
            text-align: center;
            padding: 3rem;
        }

        @media (max-width: 768px) {
            .booking-header {
                flex-direction: column;
                gap: 1rem;
            }
            
            .booking-details {
                grid-template-columns: 1fr;
            }
            
            .booking-footer {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</body>
</html>
